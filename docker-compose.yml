services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - scripts/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
