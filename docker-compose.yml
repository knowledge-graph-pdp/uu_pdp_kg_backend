services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Format env_file panjang butuh Docker Compose >= 2.24.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - scripts/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
